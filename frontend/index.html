<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CloudVault</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">☁</div>
        CloudVault
      </div>
      <nav>
        <div class="nav-item active">
          <span class="nav-icon">📁</span> My Files
        </div>
      </nav>
    </aside>

    <main class="main">

      <div class="topbar">
        <h1 class="page-title">My Files</h1>
        <button id="themeToggle" class="theme-btn" title="Toggle theme">🌙</button>
      </div>

      <div class="storage-card">
        <div class="card-label">Storage Usage</div>
        <div class="storage-info">
          <span id="storageText" class="storage-used">Loading...</span>
        </div>
        <div class="bar-track">
          <div id="storageFill" class="bar-fill"></div>
        </div>
      </div>

      <div class="upload-card">
        <div class="card-label">Upload your files</div>
        <div id="dropZone" class="drop-area">
          <div class="drop-icon">📂</div>
          <div class="drop-text">
            <strong>Drag & drop files here</strong><br>or click to browse
          </div>
          <input type="file" id="fileInput" hidden />
        </div>
        <div class="upload-row">
          <span id="selectedFile" class="file-label">No file selected</span>
          <button class="btn-upload" onclick="uploadFile()">Upload</button>
        </div>
        <p id="status" class="status-text"></p>
      </div>

      <div class="files-card">
        <div class="files-header">
          <div class="card-label" style="margin:0">Your Files</div>
          <span id="filesCount" class="files-count">0 files</span>
        </div>
        <div id="fileGrid" class="file-grid"></div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
